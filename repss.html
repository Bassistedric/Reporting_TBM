<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#104861"/>
  <title>QHSE Tools — RePSS</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root{--vma-blue:#104861;--bg:#f5f6f8;--card:#fff;--border:#e6e6e6;--text:#111827;--muted:#6b7280;--shadow:0 10px 26px rgba(0,0,0,.08);--radius:18px}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:720px;margin:0 auto;padding:14px}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.92);backdrop-filter:blur(8px);padding:10px 0}
    .rowTop{display:flex;align-items:center;gap:10px;justify-content:space-between}
    .back{border:1px solid var(--border);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;text-decoration:none;color:var(--text)}
    .title{flex:1;background:var(--vma-blue);color:#D9D9D9;border-radius:16px;padding:12px 14px;text-align:center;font-weight:900;letter-spacing:.3px;box-shadow:var(--shadow)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:12px}
    .card h3{margin:0 0 12px;font-size:15px;color:var(--vma-blue)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label.lbl{display:block;font-size:12px;color:#374151;margin-bottom:3px;font-weight:600}
    input[type=text],input[type=date],select{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:14px;font-family:inherit}
    .field{margin-bottom:10px}
    .tplCard{border:1px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;transition:all .15s}
    .tplCard.sel{border-color:#0ea5e9;background:#f0f9ff}
    .tplCard .tplName{font-weight:700;font-size:14px}.tplCard .tplDesc{font-size:11px;color:var(--muted);margin-top:2px}
    .chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer}
    .chk input{accent-color:#0ea5e9;width:16px;height:16px}
    .btnGen{width:100%;padding:14px;background:var(--vma-blue);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
    .btnGen:disabled{opacity:.4;cursor:not-allowed}
    .btnGen:active:not(:disabled){transform:translateY(1px)}
    .btnPrint{background:#0ea5e9;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
    #previewBar{display:none;position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:10px 16px;align-items:center;gap:12px}
    #previewBar .backP{background:none;border:1px solid #475569;color:#94a3b8;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
    #previewBar .info{flex:1;font-size:13px;color:#94a3b8}
    @media print{#previewBar,.topbar,.wrap{display:none!important}#printZone{display:block!important}}
  </style>
</head>
<body>

<div id="formView">
  <div class="wrap">
    <div class="topbar">
      <div class="rowTop">
        <a class="back" href="./index.html">←</a>
        <div class="title">RePSS — Petite cellule</div>
      </div>
    </div>

    <!-- 1. Type -->
    <div class="card">
      <h3>1. Type de travaux</h3>
      <div id="tplGrid" style="display:grid;gap:8px"></div>
    </div>

    <!-- 2. Client -->
    <div class="card" id="cardClient" style="display:none">
      <h3>2. Informations client</h3>
      <div class="row2">
        <div class="field"><label class="lbl">Réf. chantier</label><input type="text" id="refChantier" placeholder="8A5034"></div>
        <div class="field"><label class="lbl">Raison sociale</label><input type="text" id="clientNom" placeholder="Westland"></div>
      </div>
      <div class="field"><label class="lbl">Adresse client</label><input type="text" id="clientAdresse" placeholder="Boulevard Sylvain Dupuis 433, 1070 Bruxelles"></div>
      <div class="row2">
        <div class="field"><label class="lbl">Représentant client</label><input type="text" id="clientRepresentant" placeholder="Christian Meskens"></div>
        <div class="field"><label class="lbl">Fonction</label><input type="text" id="clientFonction" value="Responsable technique"></div>
      </div>
      <div class="row2">
        <div class="field"><label class="lbl">Tél. client</label><input type="text" id="clientTel"></div>
        <div class="field"><label class="lbl">GSM client</label><input type="text" id="clientGSM"></div>
      </div>
      <div class="field"><label class="lbl">Lieu spécifique d'exécution</label><input type="text" id="lieuExecution" placeholder="= nom client par défaut"></div>
    </div>

    <!-- 3. Dates -->
    <div class="card" id="cardDates" style="display:none">
      <h3>3. Dates & équipe</h3>
      <div class="row2">
        <div class="field"><label class="lbl">Date début</label><input type="date" id="dateDebut"></div>
        <div class="field"><label class="lbl">Date fin présumée</label><input type="date" id="dateFin"></div>
      </div>
      <div class="row2">
        <div class="field"><label class="lbl">Représentant VMA</label><input type="text" id="representantVMA" value="Fabrice Devaux"></div>
        <div class="field"><label class="lbl">GSM VMA</label><input type="text" id="gsmVMA" value="+32 496 58 05 49"></div>
      </div>
      <div class="row2">
        <div class="field"><label class="lbl">Sous-traitants</label><input type="text" id="sousTraitants" value="Czag Works"></div>
        <div class="field"><label class="lbl">Activités S-T</label><input type="text" id="activitesST" value="Grutage"></div>
      </div>
    </div>

    <!-- 4. Options -->
    <div class="card" id="cardOptions" style="display:none">
      <h3>4. Options chantier</h3>
      <div class="row2">
        <label class="chk"><input type="checkbox" id="coactivite" checked>Coactivité</label>
        <label class="chk"><input type="checkbox" id="seveso">SEVESO</label>
        <label class="chk"><input type="checkbox" id="accueilSecu">Accueil sécurité</label>
        <label class="chk"><input type="checkbox" id="ouvertureChantier">Ouverture chantier client</label>
        <label class="chk"><input type="checkbox" id="gaz">Présence de gaz</label>
      </div>
      <div id="gazExtra" style="display:none;margin-top:8px">
        <div class="field"><label class="lbl">Type de gaz</label><input type="text" id="gazType" placeholder="Chlore"></div>
        <div class="field"><label class="lbl">Produits dangereux</label><input type="text" id="produitsDang" placeholder="Chlore, soude caustique, mazout"></div>
        <div class="field"><label class="lbl">Pressions / températures</label><input type="text" id="pressionTemp"></div>
      </div>
    </div>

    <button class="btnGen" id="btnGen" disabled onclick="generate()">Générer l'aperçu PPSS →</button>
  </div>
</div>

<div id="previewBar" style="display:none">
  <button class="backP" onclick="backToForm()">← Retour</button>
  <span class="info" id="previewInfo"></span>
  <button class="btnPrint" onclick="doPrint()">Imprimer / PDF</button>
</div>
<div id="printZone" style="display:none;max-width:780px;margin:0 auto;padding:20px;font-family:Arial,sans-serif;font-size:11px;color:#000;background:#fff"></div>

let selTpl="";

// Build template cards
const grid=document.getElementById("tplGrid");
Object.entries(T).forEach(([k,v])=>{
  const d=document.createElement("div");
  d.className="tplCard";d.dataset.key=k;
  d.innerHTML=`<div class="tplName">${v.label}</div><div class="tplDesc">${v.desc} — ${v.travaux.join(" / ")}</div>`;
  d.onclick=()=>{
    document.querySelectorAll(".tplCard").forEach(c=>c.classList.remove("sel"));
    d.classList.add("sel");selTpl=k;
    document.getElementById("cardClient").style.display="";
    document.getElementById("cardDates").style.display="";
    document.getElementById("cardOptions").style.display="";
    checkBtn();
  };
  grid.appendChild(d);
});

document.getElementById("gaz").onchange=e=>{
  document.getElementById("gazExtra").style.display=e.target.checked?"":"none";
};

function checkBtn(){
  const ok=selTpl&&document.getElementById("refChantier").value&&document.getElementById("clientNom").value;
  document.getElementById("btnGen").disabled=!ok;
}
document.querySelectorAll("#cardClient input,#cardDates input").forEach(i=>i.oninput=checkBtn);

function val(id){return document.getElementById(id).value}
function chk(id){return document.getElementById(id).checked}
function cb(v){return v?"☒":"☐"}
function fmtDate(d){if(!d)return"JJ/MM/AAAA";const p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}

function generate(){
  const t=T[selTpl],r=RISK[t.risques];
  const ref=val("refChantier"),nom=val("clientNom");
  const now=new Date();
  const ds=String(now.getDate()).padStart(2,"0")+"/"+String(now.getMonth()+1).padStart(2,"0")+"/"+now.getFullYear();
  const mois=now.toLocaleDateString("fr-BE",{month:"long",year:"numeric"});
  const hdr=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr>
    <td style="width:100px;padding:4px"><img src="${VMA_LOGO}" style="height:40px"></td>
    <td style="text-align:center;font-size:16px;font-weight:bold;color:#0a5e6b">${ref} - ${nom} - PPSS</td>
    <td style="text-align:right;font-size:10px;width:120px">${ds}<br>Ver 1<br>PAGE</td></tr></table>`;

  const cs="border:1px solid #333;padding:4px 6px;font-size:11px;vertical-align:top";
  const hs=cs+";font-weight:bold;background:#e8e8e8;text-align:center";
  const ss=cs+";font-weight:bold;background:#d0d0d0;text-align:center;font-size:12px";

  const lieu=val("lieuExecution")||nom;
  const sanV=t.loc.san_v?1:0,sanC=t.loc.san_c?1:0;

  // ── PAGE 1 ──
  let p1=hdr.replace("PAGE","1/3");
  p1+=`<table style="width:100%;border-collapse:collapse;font-size:10px;margin-bottom:4px"><tr><td style="width:33%">Auteur : Responsable QSE</td><td style="text-align:center">Approbateur : Directeur</td><td style="text-align:right">Application : ${mois}</td></tr></table>`;
  p1+=`<div style="border:1px solid #999;padding:6px;font-size:10px;margin-bottom:8px;font-style:italic"><strong><u>Interdiction d'utiliser ce document</u></strong> pour un chantier qui comprend des <strong><u>risques aggravés</u></strong> (mis en italique et barrés) et pour les chantiers dont le total des heures prestées par VMA serait supérieur à 1000 heures → obligation alors d'utiliser le formulaire de PSS complet.</div>`;

  // Coordonnées
  p1+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td style="${hs};width:50%">VMA-Sud</td><td style="${hs}">Client : ${nom}</td></tr>
  <tr><td style="${cs}">Adresse :<br>Rue d'Edimbourg 19,<br>B-6040 Jumet<br>TEL : 071/12.92.00<br>FAX : -<br>Représentant :<br>Jean-François Henry<br>Fonction : Project Manager<br>GSM : 0492180619</td>
  <td style="${cs}">Adresse :<br>${val("clientAdresse")||"°°°°"}<br>TEL : ${val("clientTel")}<br>FAX : -<br>Représentant :<br>${val("clientRepresentant")||"°°°°"}<br>Fonction : ${val("clientFonction")}<br>GSM : ${val("clientGSM")}</td></tr></table>`;

  // Lieu d'exécution
  p1+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=2 style="${ss}">RENSEIGNEMENTS DU LIEU D'EXÉCUTION</td></tr>
  <tr><td style="${cs}">Présence de coactivité ?</td><td style="${cs}">${cb(chk("coactivite"))} oui ${cb(!chk("coactivite"))} non</td></tr>
  <tr><td style="${cs}">SEVESO ?</td><td style="${cs}">${cb(chk("seveso"))} oui ${cb(!chk("seveso"))} non</td></tr>
  <tr><td style="${cs}">Accueil sécurité ?</td><td style="${cs}">${cb(chk("accueilSecu"))} oui ${cb(!chk("accueilSecu"))} non</td></tr></table>`;

  // Installation
  const gazOn=chk("gaz");
  p1+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=2 style="${ss}">RENSEIGNEMENTS INSTALLATION (SI USINE)</td></tr>
  <tr><td style="${cs}">Matières premières :</td><td style="${cs}">°°°°</td></tr>
  <tr><td style="${cs}">Produits dangereux :</td><td style="${cs}">${gazOn?val("produitsDang")||"°°°°":"°°°°"}</td></tr>
  <tr><td style="${cs}">Pressions / températures :</td><td style="${cs}">${gazOn?val("pressionTemp"):""}</td></tr>
  <tr><td style="${cs}">Présence de gaz ?</td><td style="${cs}">${cb(gazOn)} oui ${cb(!gazOn)} non ${gazOn?" → "+val("gazType"):""}</td></tr></table>`;

  // Renseignements généraux
  p1+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=2 style="${ss}">RENSEIGNEMENTS GÉNÉRAUX</td></tr>
  <tr><td style="${cs}">Lieu :</td><td style="${cs}">${lieu}</td></tr>
  <tr><td style="${cs}">Mode opératoire :</td><td style="${cs}">${t.travaux.map(x=>"- "+x).join("<br>")}</td></tr>
  <tr><td style="${cs}">Début : ${fmtDate(val("dateDebut"))}</td><td style="${cs}">Fin : ${fmtDate(val("dateFin"))}</td></tr>
  <tr><td style="${cs}">Représentant VMA : ${val("representantVMA")}</td><td style="${cs}">GSM : ${val("gsmVMA")}</td></tr>
  <tr><td style="${cs}">Régime : ${cb(1)} 1 poste | Horaire : 6h-16h</td><td style="${cs}">Effectif moyen : 2</td></tr>
  <tr><td style="${cs}">Sous-traitants : ${val("sousTraitants")}</td><td style="${cs}">Activités : ${val("activitesST")}</td></tr></table>`;

  // Mesures + habilitations
  p1+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=2 style="${ss}">MESURES GÉNÉRALES DE SÉCURITÉ</td></tr>
  <tr><td colspan=2 style="${cs}">Ouverture de chantier par le <b>client</b> ? ${cb(chk("ouvertureChantier"))} oui ${cb(!chk("ouvertureChantier"))} non</td></tr></table>`;

  const h=t.hab;
  p1+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=4 style="${cs};font-weight:bold">Habilitations</td></tr>
  <tr><td style="${cs}">${cb(h.chariot)} Chariot</td><td style="${cs}">${cb(h.ba4)} BA4</td><td style="${cs}">${cb(h.nacelle)} Nacelle</td><td style="${cs}">${cb(h.ba5)} BA5</td></tr>
  <tr><td style="${cs}">${cb(h.pontier)} Pontier</td><td style="${cs}">${cb(h.soudeur)} Soudeur</td><td style="${cs}">${cb(h.levage)} Levage</td><td style="${cs}">${cb(h.frigoriste)} Frigoriste</td></tr></table>`;

  // Locaux
  p1+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=2 style="${cs};font-weight:bold">Locaux sociaux</td></tr>
  <tr><td style="${cs}">Réfectoire : ${cb(t.loc.ref_v)} VMA, ${cb(t.loc.ref_c)} Client</td><td style="${cs}">Sanitaires : ${cb(sanV)} VMA, ${cb(sanC)} Client</td></tr>
  <tr><td style="${cs}">Vestiaires : ☐ VMA, ☐ Client</td><td style="${cs}">Douches : ☐ VMA, ☐ Client</td></tr></table>`;
  p1+=`<div style="font-size:10px;margin-bottom:8px">Engins mis à disposition par le client : ☐ oui, ☒ non</div>`;

  // ── PAGE 2 ──
  let p2=hdr.replace("PAGE","2/3");
  const e=t.epi;
  p2+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=2 style="${cs};font-weight:bold">Equipements de protection individuelle</td></tr>
  <tr><td style="${cs}">${cb(e.aud)} Protection auditive | ${cb(e.fac)} Protection faciale | ${cb(e.har)} Harnais</td>
  <td style="${cs}">${cb(e.masq)} Masque anti-poussière | ${cb(e.gant)} Gants | ${cb(e.aut)} Autres${e.aut?" : "+e.autD:""}</td></tr></table>`;

  p2+=`<div style="border:1px solid #333;padding:6px;font-size:10px;margin-bottom:8px"><b>Protection environnement</b><br>
  Déchets : ${cb(t.dech_v)} VMA, ☐ Client<br>Gaz frigorifiques : ${cb(t.frigo_v)} VMA, ☐ Client</div>`;

  // Permis
  p2+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px"><tr><td colspan=2 style="${ss}">MESURES GÉNÉRALES DE SÉCURITÉ</td></tr>
  <tr><td style="${cs}">Permis de travail :</td><td style="${cs}">☒ VMA, ☒ Client</td></tr>
  <tr><td style="${cs}">Consignation :</td><td style="${cs}">☒ VMA, ☒ Client</td></tr>
  <tr><td style="${cs}">Espace restreint :</td><td style="${cs}">☐ VMA, ☐ Client</td></tr>
  <tr><td style="${cs}">Fouille / ouverture plancher :</td><td style="${cs}">☐ VMA, ☐ Client</td></tr>
  <tr><td style="${cs}">Permis de feu :</td><td style="${cs}">☒ VMA, ☒ Client</td></tr>
  <tr><td style="${cs}"><em style="text-decoration:line-through">Permis espace confiné</em> :</td><td style="${cs}">☐ VMA, ☐ Client</td></tr>
  <tr><td style="${cs}">Mode opératoire :</td><td style="${cs}">☒ VMA</td></tr></table>`;

  // Risques
  function riskRow(c1,l1,c2,l2){return `<tr><td style="${cs}">${cb(c1)} ${l1}</td><td style="${cs}">${cb(c2)} ${l2}</td><td style="${cs};text-align:center">${cb(c1)}</td><td style="${cs};text-align:center">${cb(c1)}</td></tr>`}

  p2+=`<table style="width:100%;border-collapse:collapse;margin-bottom:8px">
  <tr><td colspan=2 style="${ss}">IDENTIFICATION DES RISQUES ET MESURES DE PRÉVENTION</td><td style="${hs};width:40px">VMA</td><td style="${hs};width:40px">CL</td></tr>`;

  // Circulation
  p2+=`<tr><td colspan=4 style="${cs};font-weight:bold;background:#eee">Circulation et accès :</td></tr>`;
  p2+=riskRow(r.circ[0],"Choc, collision",r.circ[3],"Respect plans, règles circulation");
  p2+=riskRow(r.circ[1],"Chute de plain-pied",r.circ[4],"Respect des zones balisées");
  p2+=riskRow(r.circ[2],"Chute avec dénivellation",r.circ[5],"Sécuriser accès, tenir la rampe");

  // Hauteur
  p2+=`<tr><td colspan=4 style="${cs};font-weight:bold;background:#eee">Travaux en hauteur :</td></tr>`;
  p2+=riskRow(r.haut[0],"Chute (échelle, échafaudage<5m)",r.haut[4],"Matériel ok, fixé, réceptionné");
  p2+=`<tr><td style="${cs}">${cb(0)} <em style="text-decoration:line-through">Chute (échafaudage +5m)</em></td><td style="${cs}">${cb(0)} Pas de surcharge</td><td style="${cs};text-align:center">☐</td><td style="${cs};text-align:center">☐</td></tr>`;
  p2+=riskRow(r.haut[2],"Chute d'objets (travaux superposés)",r.haut[6],"Coordination, protections niv");
  p2+=riskRow(r.haut[3],"Chute (endroits non protégés)",r.haut[7],"Vigilance partagée");

  // Manutention
  p2+=`<tr><td colspan=4 style="${cs};font-weight:bold;background:#eee">Manutention et Levage :</td></tr>`;
  p2+=riskRow(r.manu[0],"Mal de dos",1,"Gestes et postures adéquats");
  p2+=riskRow(r.manu[1],"Coincement, écrasement",1,"Port de gants adaptés");
  p2+=riskRow(r.manu[2],"Basculement d'un engin",1,"Aptitude, matériel adapté");
  p2+=riskRow(r.manu[3],"Chute d'un objet levé",1,"Balisage, élingage conforme");

  // Environnement
  p2+=`<tr><td colspan=4 style="${cs};font-weight:bold;background:#eee">Environnement de travail :</td></tr>`;
  p2+=riskRow(r.env[0],"Défaut d'éclairage",r.env[0],"Eclairage d'appoint");
  p2+=riskRow(r.env[1],"Ambiance thermique",r.env[1],"Boissons adaptées, repos");
  p2+=riskRow(r.env[2],"Niveau sonore important",r.env[2],"Port d'EPI adaptés");
  p2+=riskRow(r.env[3],"Poussières important",r.env[3],"Port de masques P2, P3");
  p2+=riskRow(r.env[4],"Produits dangereux",r.env[4],"Présence fiches MSDS");

  // Electrique
  p2+=`<tr><td colspan=4 style="${cs};font-weight:bold;background:#eee">Risques électriques :</td></tr>`;
  p2+=`<tr><td style="${cs}">☐ <em style="text-decoration:line-through">Haute tension (+1500V)</em></td><td style="${cs}">☐ ---</td><td style="${cs};text-align:center">☐</td><td style="${cs};text-align:center">☐</td></tr>`;
  p2+=riskRow(r.elec[1],"Equipement de production",r.elec[1],"Consignation");
  p2+=riskRow(r.elec[2],"Equipement chantier sous tension",r.elec[2],"Equipement contrôlé");
  p2+=riskRow(r.elec[3],"Travaux en enceinte métallique",0,"Eclairage TBTS, transfo, 30mA");

  // Autres
  p2+=`<tr><td colspan=4 style="${cs};font-weight:bold;background:#eee">Autres :</td></tr>`;
  p2+=riskRow(r.aut[0],"Proscrire matières grasses (soudures)",r.aut[3],"Utilisation EPI adéquats");
  p2+=riskRow(r.aut[1],"Brûlures (chalumeau)",r.aut[4],"Permis feu et extincteur");
  p2+=riskRow(r.aut[2],"Intensité lumineuse chalumeau",r.aut[5],"Lunette soudeur");
  p2+=`</table>`;

  // ── PAGE 3 ──
  let p3=hdr.replace("PAGE","3/3");
  p3+=`<table style="width:100%;border-collapse:collapse;margin-bottom:16px"><tr><td colspan=2 style="${ss}">ORGANISATION DES SECOURS - PLAN D'URGENCE INTERNE CLIENT</td></tr>
  <tr><td style="${cs}">Numéro d'appel d'urgence :</td><td style="${cs}"><b style="color:red">112 ou en interne client</b></td></tr>
  <tr><td style="${cs}">Autres numéros :</td><td style="${cs}">☐ Pompiers : °°°° | ☐ Gardiennage : °°°°</td></tr></table>`;

  p3+=`<table style="width:100%;border-collapse:collapse;margin-bottom:16px"><tr><td colspan=3 style="${ss}">APPROBATION DE PLAN SÉCURITÉ SANTÉ ABRÉGÉ</td></tr>
  <tr><td style="${cs};width:33%;text-align:center"><b>vma-sud</b><br>Nom et signature du responsable<br><div style="height:60px"></div></td>
  <td style="${cs};width:34%;text-align:center"><b>vma-sud</b><br>Conseiller en Prévention :<br><br><img src="${VISA_SIPP}" style="height:90px;object-fit:contain"></td>
  <td style="${cs};width:33%;text-align:center">Client : °°°°<br>Nom et signature :<br><div style="height:60px"></div></td></tr></table>`;

  // Emargement
  let rows="";for(let i=0;i<12;i++)rows+=`<tr><td style="${cs};height:24px">&nbsp;</td><td style="${cs}">&nbsp;</td><td style="${cs}">&nbsp;</td><td style="${cs}">&nbsp;</td></tr>`;
  p3+=`<table style="width:100%;border-collapse:collapse"><tr><td colspan=4 style="${ss}">EMARGEMENT DU PERSONNEL, PRISE DE CONNAISSANCE DU PSS ABRÉGÉ</td></tr>
  <tr><td style="${hs}">Date</td><td style="${hs}">Société</td><td style="${hs}">Nom et prénom</td><td style="${hs}">Signature</td></tr>${rows}</table>`;

  // Assemble
  const zone=document.getElementById("printZone");
  zone.innerHTML=`<div style="page-break-after:always">${p1}</div><div style="page-break-after:always">${p2}</div><div>${p3}</div>`;

  document.getElementById("formView").style.display="none";
  document.getElementById("previewBar").style.display="flex";
  zone.style.display="block";
  document.getElementById("previewInfo").innerHTML=`<b>${ref} - ${nom}</b>`;
  window.scrollTo(0,0);
}

function backToForm(){
  document.getElementById("formView").style.display="";
  document.getElementById("previewBar").style.display="none";
  document.getElementById("printZone").style.display="none";
}

function doPrint(){
  const content=document.getElementById("printZone").innerHTML;
  const w=window.open("","_blank");
  w.document.write(`<html><head><title>PPSS</title><style>@page{size:A4;margin:15mm}body{font-family:Arial,sans-serif;font-size:11px;margin:0;padding:0}table{border-collapse:collapse}@media print{.no-print{display:none}}</style></head><body>${content}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),500);
}
</script>
</body>
</html>
